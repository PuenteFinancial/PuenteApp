name: Security and Compliance Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/api/src/routes/**"
      - "apps/api/src/services/**"
      - "apps/api/src/plugins/audit.ts"
      - "**/consent/**"
      - "**/credit/**"
      - "**/*auth*"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # so it can post findings as a comment
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # full history so it can diff against base
      # SHA-pinned: the floating v1 tag shipped a broken v1.0.175 on
      # 2026-07-15 (runs die in ~2s with is_error:true). This is v1.0.174,
      # the last known-good. Unpin once upstream fixes it.
      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The ACTION owns posting, not Claude. Without this the run went
          # green while saying nothing (2026-08-31, PR #265): Claude reviewed
          # across 9 turns, tried once to post, and was denied — CI is
          # non-interactive, the project allowlist in .claude/settings.json
          # permits only pnpm typecheck/lint/test, and .mcp.json exposes no
          # GitHub tool. track_progress makes the action create and update the
          # PR comment itself, so findings land without granting a CI-run
          # Claude new powers on a public repo.
          track_progress: true
          prompt: |
            Review the diff in this PR (against the base branch) using TWO subagents:
            1. The security-reviewer subagent.
            2. The compliance-reviewer subagent.
            Report their findings grouped by agent. If both report no issues,
            say "✅ Security & compliance: no issues." Do NOT try to post a
            comment yourself — the action publishes this output to the PR.
