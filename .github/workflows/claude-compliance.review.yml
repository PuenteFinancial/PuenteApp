name: Security and Compliance Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/api/src/routes/**"
      - "apps/api/src/services/**"
      - "apps/api/src/plugins/audit.ts"
      - "**/consent/**"
      - "**/credit/**"
      - "**/*auth*"
      # NOT self-triggering, and it cannot be. claude-code-action refuses to
      # run on any PR that modifies a workflow file ("Action skipped due to
      # workflow validation error") — the right call, since otherwise a PR
      # could rewrite the reviewer that guards it. Adding this file to the
      # paths above only produces a job that runs, skips the action, and
      # reports a GREEN check with no review behind it, which is the exact
      # failure class this workflow keeps falling into. Tried on PR #309;
      # reverted. A change to this file is therefore validated by the NEXT PR
      # that touches apps/api, never by its own.

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # so it can post findings as a comment
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # full history so it can diff against base

      # SHA-pinned (v1.0.216). History: the floating v1 tag shipped a broken
      # v1.0.175 on 2026-07-15 (runs died in ~2s with is_error:true), so this
      # was pinned at v1.0.174 and has since been bumped. Unpin only once the
      # floating tag has been stable for a while.
      - id: claude
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress makes the ACTION create the PR comment and hands
          # Claude the tool to update it (2026-08-31, PR #265: without it the
          # run went green while saying nothing, because CI is
          # non-interactive and .mcp.json exposes no GitHub tool).
          #
          # It does NOT publish Claude's final message. The action's own last
          # act is to stamp the comment with a job link, nothing more — so the
          # findings only reach the PR if Claude writes them into the comment
          # itself. The prompt below used to forbid exactly that, which is why
          # every run since #265 froze at the progress checklist while
          # reporting success (diagnosed on PR #308).
          track_progress: true
          # The default tool set under track_progress is Glob/Grep/LS/Read,
          # the comment tool, and the action's git add/commit/rm/push — no
          # `git diff`. The action supplies only a <changed_files> manifest
          # (paths and line counts, never content), so "review the diff" was
          # impossible: the reviewer read whole files at head with no way to
          # tell which lines were new. Diagnosed on PR #308.
          #
          # This ACCUMULATES with the action's own --allowedTools rather than
          # replacing it (allowedTools is in the SDK parser's
          # ACCUMULATING_FLAGS, base-action/src/parse-sdk-options.ts), so only
          # the genuinely new grants belong here — the read-only git commands.
          # Re-listing Read/Grep/Glob or the comment tool would be noise.
          #
          # Note this cannot NARROW the default set: the reviewer keeps the
          # action's git add/commit/push grants. Revoking those would take
          # --disallowedTools (also accumulating, and deny beats allow).
          # Worth doing — a reviewer should not be able to write to the branch
          # it reviews — but it is a separate change from making it speak.
          claude_args: >-
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git status:*)"
          prompt: |
            Review this PR using TWO subagents:
            1. The security-reviewer subagent.
            2. The compliance-reviewer subagent.

            RUN BOTH IN THE FOREGROUND. Pass `run_in_background: false` on
            every Agent call, and send both calls in ONE message so they run
            concurrently and this turn blocks until both have reported. Do NOT
            end your turn while either is still running.

            This is the whole reason the review exists and the single way it
            has failed: subagents default to BACKGROUND, where the caller is
            notified later. In CI there is no later. The run ends when this
            turn ends, so launching them and returning tears the job down
            mid-review — the comment freezes at "Both subagents are running
            now" and the check still goes green (observed on PR #311: clean
            exit, is_error false, 11 turns, 52s, no findings ever posted).

            Review the DIFF, not the files at head. Get it with:
              git diff origin/${{ github.base_ref }}...HEAD
            (checkout uses fetch-depth 0, so that ref resolves; `...` already
            means "since the merge base". Read files only to get context on a
            hunk the diff alone does not settle.)

            When both subagents have REPORTED BACK, you MUST publish the
            result by calling mcp__github_comment__update_claude_comment,
            replacing your progress checklist with the findings grouped by
            agent. Nothing else posts for you: a run that ends without that
            call reports success and says nothing, which is the failure this
            prompt exists to avoid. If both agents report no issues, the body
            is "✅ Security & compliance: no issues."

            END THE PUBLISHED COMMENT WITH THIS LINE, EXACTLY, ON ITS OWN:
              <!-- compliance-review-complete -->
            A step after this one greps the PR for that marker and FAILS the
            check if it is absent, so a review that did not happen is red
            instead of green. If you cannot complete a subagent, publish what
            you have, say which agent did not report and why, and still emit
            the marker — a stated gap is a review result; silence is not.

      # THE CHECK NOW MEANS SOMETHING. Everything above is prompt-shaped, and
      # every failure this workflow has had was Claude ending its turn without
      # publishing while the action reported success — twice, for two unrelated
      # reasons (#265 forbade the publish call; #311 backgrounded the
      # subagents). A green check that is not evidence of a review is worse
      # than no check, because it is the one people trust on the money paths.
      #
      # So the gate is no longer "did the action exit 0" but "is there a
      # published review on this PR". The marker is the contract, and it is
      # deliberately something only the final publish emits: a frozen progress
      # checklist does not carry it.
      #
      # Guarded on the same condition as the log upload: when the action SKIPS
      # (a workflow-modifying PR — see the paths note at the top) Claude never
      # ran, there is nothing to publish, and failing here would be the same
      # lie in the other direction.
      - name: Verify the review was actually published
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Collected to a FILE before grepping, deliberately. `gh api … | grep -q`
          # looks tidier and is wrong: grep -q exits the moment it matches, gh
          # takes SIGPIPE and returns 141, and `pipefail` then reports the
          # pipeline as failed — so a review that WAS published would fail this
          # check. A false red on the one step whose job is to stop false greens.
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[].body' > /tmp/pr-comments.txt

          # The marker is still the STRONGEST signal: the reviewer only emits it
          # at the end of its publish call, so its presence proves the turn got
          # there. Checked first, and nothing below weakens it.
          if grep -qF '<!-- compliance-review-complete -->' /tmp/pr-comments.txt; then
            echo "Review published (marker)."
            exit 0
          fi

          # Fallback, added 2026-09-11 after this step false-redded PRs #313 and
          # #314. Both carried a COMPLETE review — both subagents run, findings
          # written, verdict stated — and neither carried the marker, because
          # emitting an exact token on its own line is an instruction the model
          # has to remember, and it is the very last thing it does.
          #
          # The guard exists to catch a run that published NOTHING (the turn
          # ends early while subagents are still backgrounded). It does not need
          # a magic token to catch that: a run that published nothing has no
          # review sections either. So accept the structure the prompt mandates
          # — a security section AND a compliance section — as proof of the same
          # thing. A silent run still fails, which is the whole point; a real
          # review that forgot one line no longer blocks a merge.
          if grep -qiE '(security)[[:space:]]+review' /tmp/pr-comments.txt \
             && grep -qiE '(compliance)[[:space:]]+review' /tmp/pr-comments.txt; then
            echo "::warning::Review published, but WITHOUT the completion marker."
            echo "Accepted on structure: both review sections are present. If this keeps"
            echo "happening the prompt's final-line instruction is not landing reliably."
            exit 0
          fi

          echo "::error::The reviewer ran but published no findings." >&2
          echo "No comment on this PR carries <!-- compliance-review-complete -->, and none" >&2
          echo "carries both a security and a compliance review section — so the run ended" >&2
          echo "before the publish call. Read the execution-log artifact on this job: a turn" >&2
          echo "count in the low teens with is_error false means the turn ended early" >&2
          echo "(backgrounded subagents), not that the review found nothing." >&2
          exit 1

      # The per-turn stream never reaches the CI log — only the init and
      # result objects do — so a run that says nothing leaves no trace of what
      # it found. Keep the full transcript for exactly that case.
      #
      # The output is EMPTY whenever the action skips (a workflow-modifying
      # PR, as above). upload-artifact treats an empty `path` as a missing
      # required input and fails the job, so the guard is load-bearing:
      # if-no-files-found does not cover it, that is for a path that resolves
      # but matches nothing.
      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-execution-log
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 14
