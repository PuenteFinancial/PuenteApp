version: 2
updates:
  # Root workspace + all pnpm packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    rebase-strategy: auto
    open-pull-requests-limit: 5
    # Only propose versions published at least 3 days ago — pnpm's
    # minimumReleaseAge policy (24h) rejects anything fresher at install time
    cooldown:
      default-days: 3
    groups:
      # Batch minor/patch bumps into one PR per group to reduce noise
      expo:
        patterns: ["expo*", "@expo/*"]
      react-native:
        patterns: ["react-native*", "@react-native/*"]
      fastify:
        patterns: ["fastify*", "@fastify/*"]
      typescript-tooling:
        patterns: ["typescript", "@typescript-eslint/*", "eslint*"]
        update-types: ["minor", "patch"]
      misc:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Expo SDK majors require manual migration (covers expo, expo-router,
      # expo-constants, etc. — companion packages jump majors with the SDK)
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      # --- Expo SDK-managed packages: Dependabot must not touch these at all ---
      # Their versions are dictated by the installed Expo SDK (see
      # `expo/bundledNativeModules.json`), not by semver. CI never builds the
      # mobile app, so a bump that breaks SDK compatibility passes every check
      # and only surfaces at EAS build or runtime. That is exactly what happened
      # here: weekly bumps walked react-native from the SDK-56 pin 0.85.3 up to
      # 0.86.0 and @sentry/react-native a full major past the supported ~7.11.0,
      # leaving `npx expo-doctor` failing 7 checks with nobody notified.
      #
      # These move only via `npx expo install --check --fix` during a deliberate
      # SDK upgrade. Revisit this list when the app moves off SDK 56.
      - dependency-name: "react-native"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "@sentry/react-native"
      # NOTE: `react` is deliberately NOT ignored. It is also SDK-managed
      # (56 pins 19.2.3 exactly, to match react-native's renderer), but ignores
      # apply to the whole workspace — blocking it here would also freeze
      # apps/web, which is the live production surface on ^19.2.8. So react
      # bumps still get proposed: apply them to apps/web and revert the
      # apps/mobile hunk, leaving mobile on the SDK pin.

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    rebase-strategy: auto
    open-pull-requests-limit: 3
