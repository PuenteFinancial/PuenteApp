version: 2
#
# EXPECTED FAILURE — Dependabot SECURITY updates for transitive packages will
# fail here, and there is nothing to fix in this file. Investigated 2026-08-17
# after 24 such failures dating from 2026-08-10.
#
# Why: a security advisory lands on a transitive (dompurify, nanoid, js-yaml,
# shell-quote, sharp, brace-expansion, uuid, esbuild, @hono/node-server so far —
# none of them a direct dependency of anything in this repo). The only way to
# pin a transitive under pnpm 11 is an `overrides` entry in
# pnpm-workspace.yaml. Dependabot's npm_and_yarn updater does not know that; it
# writes `overrides` into package.json, where pnpm 11 SILENTLY IGNORES it. Its
# update_files step therefore cannot produce a working change and the job dies
# with a bare `unknown_error` per package.
#
# What to do instead: add the pin by hand to the `overrides` block in
# pnpm-workspace.yaml (it already carries six of them, each with a note on why
# it exists and when it can go). The GitHub security alert still fires and is
# still the signal — only the automated PR is broken.
#
# How to tell this apart from a real problem: these failures are always
# npm_and_yarn, always a single named package, and always one you will not find
# in any package.json. Regular grouped version bumps in the same run succeed.
#
updates:
  # Root workspace + all pnpm packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    rebase-strategy: auto
    open-pull-requests-limit: 5
    # Only propose versions published at least 3 days ago — pnpm's
    # minimumReleaseAge policy (24h) rejects anything fresher at install time
    cooldown:
      default-days: 3
    groups:
      # Batch minor/patch bumps into one PR per group to reduce noise
      expo:
        patterns: ["expo*", "@expo/*"]
      react-native:
        patterns: ["react-native*", "@react-native/*"]
      fastify:
        patterns: ["fastify*", "@fastify/*"]
      typescript-tooling:
        patterns: ["typescript", "@typescript-eslint/*", "eslint*"]
        update-types: ["minor", "patch"]
      misc:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Expo SDK majors require manual migration (covers expo, expo-router,
      # expo-constants, etc. — companion packages jump majors with the SDK)
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      # --- Expo SDK-managed packages: Dependabot must not touch these at all ---
      # Their versions come from the installed SDK's bundledNativeModules.json,
      # not from semver. CI never builds the mobile app, so a bump that breaks
      # SDK compatibility passes every check and only surfaces at EAS build or
      # runtime — which is exactly how mobile ended up a full major ahead on
      # @sentry/react-native and a minor ahead on react-native while still on
      # SDK 56. Dependabot was effectively performing a piecemeal, unplanned
      # SDK upgrade: the react-native 0.86.2 it kept proposing is SDK 57's pin.
      #
      # These move only via a deliberate SDK upgrade. Revisit on the next one.
      - dependency-name: "react-native"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "@sentry/react-native"
      # NOTE: `react` is deliberately NOT ignored. It is SDK-managed too (57
      # pins 19.2.3 exactly, to match react-native's renderer), but ignores
      # apply workspace-wide and would freeze apps/web, which is live in
      # production on ^19.2.8. pnpm keeps the two apart, so react bumps still
      # get proposed — apply them to apps/web and drop the apps/mobile hunk.

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    rebase-strategy: auto
    open-pull-requests-limit: 3
